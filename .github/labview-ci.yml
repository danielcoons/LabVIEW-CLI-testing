# .github/labview-ci.yml - LabVIEW CI configuration
# Updated by the Reconfigure workflow.
schemaVersion: 1
installedVersion: 4.13.0
configuredAt: 2026-07-31T17:09:37Z
source:
  repo: danielcoons/LabVIEW-CLI-testing
  ref: v4.13.0
config:
  labviewVersion: "2026"
  os: [windows, linux]
  concurrency:
    maxParallel: 5
  container:
    use: latest
    vipc:
      - path: ".github/labview/vipm/ci-tooling.vipc"
        monitor: true
  viAnalyzer:
    default: assets/via/via-config-tsc.viancfg
activities:
  - dashboard
  - masscompile
  - vi-analyzer
  - vidiff
  - snapshots
  - custom-image
  - snapshots-2
  - unit-tests
  - builds
  - sbom

unitTests:
  thresholds:
    passedPercent:
      greenAtLeast: 100
      yellowAtLeast: 80
      redBelow: 80
  tools:
    caraya:
      enabled: false
      locations: []
    lunit:
      enabled: true
      locations: []
    vi-tester:
      enabled: false
      locations: []
    utf:
      enabled: false
      locations: []
